<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Mahbub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background: #87CEEB;
            overflow: hidden;
            position: relative;
        }
        canvas {
            display: block;
            margin: auto;
        }
        #flapBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            border: 2px solid #333;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="flapBtn">FLAP</div>
<script src="script.js"></script>
</body>
</html>
